---
# Kubernetes deployment for scalable Blockscout microservices
apiVersion: v1
kind: Namespace
metadata:
  name: blockscout
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: blockscout
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: blockscout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
# LUX Network Backend Service
apiVersion: v1
kind: Service
metadata:
  name: luxnet-backend
  namespace: blockscout
spec:
  selector:
    app: luxnet-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luxnet-backend
  namespace: blockscout
spec:
  replicas: 3
  selector:
    matchLabels:
      app: luxnet-backend
  template:
    metadata:
      labels:
        app: luxnet-backend
    spec:
      containers:
      - name: blockscout
        image: ghcr.io/blockscout/blockscout:latest
        ports:
        - containerPort: 4000
        env:
        - name: ETHEREUM_JSONRPC_VARIANT
          value: "geth"
        - name: ETHEREUM_JSONRPC_HTTP_URL
          value: "http://host.docker.internal:9650/ext/bc/dnmzhuf6poM6PUNQCe7MWWfBdTJEnddhHRNXz2x7H6qSmyBEJ/rpc"
        - name: ETHEREUM_JSONRPC_TRACE_URL
          value: "http://host.docker.internal:9650/ext/bc/dnmzhuf6poM6PUNQCe7MWWfBdTJEnddhHRNXz2x7H6qSmyBEJ/rpc"
        - name: ETHEREUM_JSONRPC_WS_URL
          value: "ws://host.docker.internal:9650/ext/bc/dnmzhuf6poM6PUNQCe7MWWfBdTJEnddhHRNXz2x7H6qSmyBEJ/ws"
        - name: CHAIN_ID
          value: "96369"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: luxnet-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: luxnet-secrets
              key: secret-key-base
        - name: DISABLE_MIGRATE
          value: "true"
        - name: POOL_SIZE
          value: "40"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
---
# LUX Network Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: luxnet-frontend
  namespace: blockscout
spec:
  selector:
    app: luxnet-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luxnet-frontend
  namespace: blockscout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: luxnet-frontend
  template:
    metadata:
      labels:
        app: luxnet-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/blockscout/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_HOST
          value: "api-explore.lux.network"
        - name: NEXT_PUBLIC_NETWORK_NAME
          value: "LUX Network"
        - name: NEXT_PUBLIC_NETWORK_ID
          value: "96369"
        - name: NEXT_PUBLIC_NETWORK_SHORT_NAME
          value: "LUX"
        - name: NEXT_PUBLIC_NETWORK_CURRENCY_NAME
          value: "LUX"
        - name: NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL
          value: "LUX"
        - name: NEXT_PUBLIC_IS_TESTNET
          value: "false"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1"
---
# Ingress for LUX Network
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: luxnet-ingress
  namespace: blockscout
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  rules:
  - host: explore.lux.network
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: luxnet-frontend
            port:
              number: 3000
  - host: api-explore.lux.network
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: luxnet-backend
            port:
              number: 4000
---
# HPA for auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: luxnet-backend-hpa
  namespace: blockscout
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: luxnet-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# PVC for Redis
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: blockscout
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Secret template (values should be base64 encoded)
apiVersion: v1
kind: Secret
metadata:
  name: luxnet-secrets
  namespace: blockscout
type: Opaque
data:
  database-url: # base64 encoded DATABASE_URL
  secret-key-base: # base64 encoded SECRET_KEY_BASE