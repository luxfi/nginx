version: '3.8'

# Scalable Blockscout Microservices Configuration
# This configuration enables horizontal scaling and load balancing

networks:
  blockchain-network:
    driver: overlay
    attachable: true

volumes:
  redis-data:
  ipfs-data:

x-common-environment: &common-env
  ETHEREUM_JSONRPC_VARIANT: geth
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-56NtB48ear7+wMSf0IQuWDAAazhpb31qyc7GiyspBP2vh7t5zlCsF5QDv76chXeN}
  ECTO_USE_SSL: 'false'
  DISABLE_MIGRATE: 'true'
  POOL_SIZE: 40
  POOL_SIZE_API: 10

x-backend-deploy: &backend-deploy
  deploy:
    replicas: 3
    update_config:
      parallelism: 1
      delay: 10s
      order: start-first
    restart_policy:
      condition: any
      delay: 5s
      max_attempts: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=blockchain-network"

services:
  # Redis for caching (single instance with persistence)
  redis:
    image: redis:7-alpine
    networks:
      - blockchain-network
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # LUX Network Backend (scalable)
  luxnet-backend:
    image: ghcr.io/blockscout/blockscout:${DOCKER_TAG:-latest}
    <<: *backend-deploy
    networks:
      - blockchain-network
    environment:
      <<: *common-env
      ETHEREUM_JSONRPC_HTTP_URL: ${LUX_RPC_URL:-http://host.docker.internal:9650/ext/bc/dnmzhuf6poM6PUNQCe7MWWfBdTJEnddhHRNXz2x7H6qSmyBEJ/rpc}
      ETHEREUM_JSONRPC_TRACE_URL: ${LUX_RPC_URL:-http://host.docker.internal:9650/ext/bc/dnmzhuf6poM6PUNQCe7MWWfBdTJEnddhHRNXz2x7H6qSmyBEJ/rpc}
      ETHEREUM_JSONRPC_WS_URL: ${LUX_WS_URL:-ws://host.docker.internal:9650/ext/bc/dnmzhuf6poM6PUNQCe7MWWfBdTJEnddhHRNXz2x7H6qSmyBEJ/ws}
      CHAIN_ID: '96369'
      DATABASE_URL: ${LUX_DATABASE_URL}
      REDIS_URL: redis://redis:6379
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.luxnet-backend.rule=Host(`api-explore.lux.network`)"
        - "traefik.http.services.luxnet-backend.loadbalancer.server.port=4000"
        - "traefik.http.routers.luxnet-backend.entrypoints=web"

  # LUX Network Frontend (scalable)
  luxnet-frontend:
    image: ghcr.io/blockscout/frontend:${FRONTEND_TAG:-latest}
    networks:
      - blockchain-network
    environment:
      NEXT_PUBLIC_API_HOST: api-explore.lux.network
      NEXT_PUBLIC_NETWORK_NAME: "LUX Network"
      NEXT_PUBLIC_NETWORK_ID: 96369
      NEXT_PUBLIC_NETWORK_SHORT_NAME: LUX
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: LUX
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: LUX
      NEXT_PUBLIC_IS_TESTNET: 'false'
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.luxnet-frontend.rule=Host(`explore.lux.network`)"
        - "traefik.http.services.luxnet-frontend.loadbalancer.server.port=3000"

  # LUX Network Stats Service
  luxnet-stats:
    image: ghcr.io/blockscout/stats:${STATS_TAG:-latest}
    networks:
      - blockchain-network
    environment:
      STATS__DB_URL: ${LUX_STATS_DATABASE_URL}
      STATS__BLOCKSCOUT_DB_URL: ${LUX_DATABASE_URL}
      STATS__CREATE_DATABASE: 'false'
      STATS__RUN_MIGRATIONS: 'false'
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.luxnet-stats.rule=Host(`stats.lux.network`)"
        - "traefik.http.services.luxnet-stats.loadbalancer.server.port=8050"

  # ZOO Network Backend (scalable)
  zoonet-backend:
    image: ghcr.io/blockscout/blockscout:${DOCKER_TAG:-latest}
    <<: *backend-deploy
    networks:
      - blockchain-network
    environment:
      <<: *common-env
      ETHEREUM_JSONRPC_HTTP_URL: ${ZOO_RPC_URL:-http://host.docker.internal:9650/ext/bc/bXe2MhhAnXg6WGj6G8oDk55AKT1dMMsN72S8te7JdvzfZX1zM/rpc}
      ETHEREUM_JSONRPC_TRACE_URL: ${ZOO_RPC_URL:-http://host.docker.internal:9650/ext/bc/bXe2MhhAnXg6WGj6G8oDk55AKT1dMMsN72S8te7JdvzfZX1zM/rpc}
      ETHEREUM_JSONRPC_WS_URL: ${ZOO_WS_URL:-ws://host.docker.internal:9650/ext/bc/bXe2MhhAnXg6WGj6G8oDk55AKT1dMMsN72S8te7JdvzfZX1zM/ws}
      CHAIN_ID: '200200'
      DATABASE_URL: ${ZOO_DATABASE_URL}
      REDIS_URL: redis://redis:6379
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.zoonet-backend.rule=Host(`api-explore.zoo.network`)"
        - "traefik.http.services.zoonet-backend.loadbalancer.server.port=4000"

  # ZOO Network Frontend (scalable)
  zoonet-frontend:
    image: ghcr.io/blockscout/frontend:${FRONTEND_TAG:-latest}
    networks:
      - blockchain-network
    environment:
      NEXT_PUBLIC_API_HOST: api-explore.zoo.network
      NEXT_PUBLIC_NETWORK_NAME: "ZOO Network"
      NEXT_PUBLIC_NETWORK_ID: 200200
      NEXT_PUBLIC_NETWORK_SHORT_NAME: ZOO
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: ZOO
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: ZOO
      NEXT_PUBLIC_IS_TESTNET: 'false'
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.zoonet-frontend.rule=Host(`explore.zoo.network`)"
        - "traefik.http.services.zoonet-frontend.loadbalancer.server.port=3000"

  # SPC Network Backend (scalable)
  spcnet-backend:
    image: ghcr.io/blockscout/blockscout:${DOCKER_TAG:-latest}
    <<: *backend-deploy
    networks:
      - blockchain-network
    environment:
      <<: *common-env
      ETHEREUM_JSONRPC_HTTP_URL: ${SPC_RPC_URL:-http://host.docker.internal:9650/ext/bc/QFAFyn1hh59mh7kokA55dJq5ywskF5A1yn8dDpLhmKApS6FP1/rpc}
      ETHEREUM_JSONRPC_TRACE_URL: ${SPC_RPC_URL:-http://host.docker.internal:9650/ext/bc/QFAFyn1hh59mh7kokA55dJq5ywskF5A1yn8dDpLhmKApS6FP1/rpc}
      ETHEREUM_JSONRPC_WS_URL: ${SPC_WS_URL:-ws://host.docker.internal:9650/ext/bc/QFAFyn1hh59mh7kokA55dJq5ywskF5A1yn8dDpLhmKApS6FP1/ws}
      CHAIN_ID: '36911'
      DATABASE_URL: ${SPC_DATABASE_URL}
      REDIS_URL: redis://redis:6379
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.spcnet-backend.rule=Host(`api-explore.sparklepony.club`)"
        - "traefik.http.services.spcnet-backend.loadbalancer.server.port=4000"

  # SPC Network Frontend (scalable)
  spcnet-frontend:
    image: ghcr.io/blockscout/frontend:${FRONTEND_TAG:-latest}
    networks:
      - blockchain-network
    environment:
      NEXT_PUBLIC_API_HOST: api-explore.sparklepony.club
      NEXT_PUBLIC_NETWORK_NAME: "Sparkle Pony Club"
      NEXT_PUBLIC_NETWORK_ID: 36911
      NEXT_PUBLIC_NETWORK_SHORT_NAME: SPC
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: SPC
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: SPC
      NEXT_PUBLIC_IS_TESTNET: 'false'
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.spcnet-frontend.rule=Host(`explore.sparklepony.club`)"
        - "traefik.http.services.spcnet-frontend.loadbalancer.server.port=3000"

  # Traefik Load Balancer
  traefik:
    image: traefik:v3.0
    networks:
      - blockchain-network
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.network=blockchain-network"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
        - "traefik.http.services.api.loadbalancer.server.port=8080"