# Add these upstream definitions to /etc/nginx/sites-available/default
# in the appropriate section with other upstream definitions

# Hanzo Mainnet upstreams
upstream blockscout_hanzonet {
    server 127.0.0.1:4003;
}

upstream blockscout_viz_hanzo {
    server 127.0.0.1:8150;  # Assuming sequential port allocation
}

upstream blockscout_sig_hanzo {
    server 127.0.0.1:8151;
}

upstream blockscout_stats_hanzo {
    server 127.0.0.1:8153;
}

upstream blockscout_user_ops_hanzo {
    server 127.0.0.1:8184;
}

upstream graph_admin_hanzo {
    server 127.0.0.1:8220;
}

# Hanzo Testnet upstreams
upstream blockscout_hanzotest {
    server 127.0.0.1:4004;  # Assuming next available port
}